name: sidra_lms
description: "Sidra — Almuntahha Islamic Learning Management System."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.31.0+50

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  sqflite: ^2.4.4
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0
  cached_network_image: ^4.0.2
  video_player: ^2.14.0
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  just_audio: ^0.10.6
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5
  crypto: ^3.0.7
  url_launcher: ^6.3.2
  file_picker: ^13.1.0
  postgres: ^3.5.17
  image_picker: ^1.2.3
  record: ^7.1.1
  package_info_plus: ^10.2.1
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10
  pdfrx: ^2.6.5
  open_filex: ^4.7.0
  google_mlkit_document_scanner: ^0.6.1
  image: ^4.10.1
  device_info_plus: 13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/branding/mark.png
    - assets/branding/from_almuntahha.png
    - assets/branding/from_almuntahha_dark.png

  fonts:
    # Headings (variable font; weight applied via FontVariation in the theme).
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Variable.ttf
    # Quranic and classical Arabic text.
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

# App icons, generated from assets/images/sidra.jpg:
#   dart run tool/gen_icons.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#F6F8F8"
  adaptive_icon_foreground: assets/branding/foreground.png
  adaptive_icon_monochrome: assets/branding/foreground.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#F6F8F8"
    theme_color: "#124F31"

# Launch screen: Sidra mark, "from Almuntahha" at the bottom.
#   dart run flutter_native_splash:create
flutter_native_splash:
  # The Sidra logo on the brand background, also in dark mode (the
  # dark-green logo is not readable on a dark background).
  color: "#FAF7F1"
  image: assets/branding/mark.png
  branding: assets/branding/from_almuntahha.png
  branding_mode: bottom
  branding_bottom_padding: 48
  color_dark: "#FAF7F1"
  image_dark: assets/branding/mark.png
  branding_dark: assets/branding/from_almuntahha.png
  android_12:
    # Android 12+ crops the icon to a circle: this version keeps the whole
    # logo inside it (the plain logo had its leaf tips cut off).
    image: assets/branding/splash_android12.png
    color: "#FAF7F1"
    icon_background_color: "#FAF7F1"
    branding: assets/branding/from_almuntahha.png
    image_dark: assets/branding/splash_android12.png
    color_dark: "#FAF7F1"
    icon_background_color_dark: "#FAF7F1"
    branding_dark: assets/branding/from_almuntahha.png
  ios: false
  web: false
