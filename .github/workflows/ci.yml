# Checks every push, and builds an APK on demand, without anyone's PC.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   APP_DATABASE_URL       the sidra_app login (public by design, see docs/OPERATIONS.md)
#   CLOUDINARY_CLOUD_NAME  the Cloudinary cloud name
#   DATABASE_URL           owner login, only for the "Database" job (migrate)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_apk:
        description: Build an APK
        type: boolean
        default: true
      channel:
        description: Build channel
        type: choice
        options: [prod, beta, dev]
        default: prod
      migrate:
        description: Apply database migrations (runs the database tests first)
        type: boolean
        default: false

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  database:
    name: Database
    if: github.event_name == 'workflow_dispatch' && inputs.migrate
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Write .env
        run: echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
      - run: dart run tool/db.dart test
      - run: dart run tool/db.dart migrate

  apk:
    name: Build APK
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Write .env (public build values only)
        run: |
          echo "APP_DATABASE_URL=${{ secrets.APP_DATABASE_URL }}" > .env
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env
      - run: dart run tool/build_apk.dart ${{ inputs.channel }}
      - uses: actions/upload-artifact@v4
        with:
          name: sidra-apk
          path: dist/*.apk
          retention-days: 30
